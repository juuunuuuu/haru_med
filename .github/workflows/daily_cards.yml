name: Daily Insta Card Generator

on:
  schedule:
    - cron: '30 22 * * *'  # UTC 22:30 = 한국 시간 매일 오전 7시 30분 실행
  workflow_dispatch:       # 수동 즉시 실행 버튼

permissions:
  contents: write

jobs:
  build-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Korean fonts & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install google-genai playwright
          playwright install chromium

      - name: Generate Instagram Card Images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_cards.py

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily insta cards" && git push)
